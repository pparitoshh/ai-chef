apiVersion: 1

datasources:
  - name: AI Chef Postgres
    uid: ai_chef_postgres
    type: postgres
    access: proxy
    url: ${POSTGRES_HOST}:5432
    database: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      # Grafana 12+ core postgres plugin reads the DB name from jsonData;
      # the legacy top-level `database` field above is ignored there.
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
    isDefault: true
